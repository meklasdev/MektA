<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MektA Framework - Playground & Documentation</title>
  <style>
    body { margin: 0; background: #030712; color: #f9fafb; font-family: system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; }
    header { background: #111827; border-bottom: 1px solid #1f2937; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    .brand { font-weight: bold; color: #a855f7; font-size: 1.25rem; }
    .playground { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: #1f2937; }
    .editor-pane, .preview-pane { background: #0b0f19; padding: 1rem; display: flex; flex-direction: column; }
    textarea { flex: 1; background: #111827; color: #e5e7eb; border: 1px solid #374151; padding: 1rem; font-family: monospace; font-size: 14px; border-radius: 6px; resize: none; }
    .output-box { flex: 1; background: #111827; border: 1px solid #374151; padding: 1rem; border-radius: 6px; overflow: auto; }
    h3 { margin-top: 0; color: #818cf8; }
  </style>
</head>
<body>
  <header>
    <div class="brand">▣ MektA Framework Playground</div>
    <div style="color: #9ca3af;">v1.6.0-Architect</div>
  </header>
  <div class="playground">
    <div class="editor-pane">
      <h3>MektA Editor (.mek)</h3>
      <textarea id="editor" spellcheck="false">&lt;page title="Dashboard"&gt;
  &lt;section class="hero"&gt;
    &lt;heading&gt;Welcome to MektA&lt;/heading&gt;
    &lt;button m-on:click={save}&gt;Save Settings&lt;/button&gt;
  &lt;/section&gt;
&lt;/page&gt;</textarea>
    </div>
    <div class="preview-pane">
      <h3>Target Compiled Preview (React / HTML)</h3>
      <div id="preview" class="output-box"></div>
    </div>
  </div>
  <script>
    const editor = document.getElementById('editor');
    const preview = document.getElementById('preview');

    function updatePreview() {
      const code = editor.value;
      preview.innerHTML = `<pre style="color: #34d399;">// Simulated React Target Compilation Output:\n` +
        `import React, { createElement } from 'react';\n\n` +
        `export default function Page() {\n` +
        `  return createElement("div", { title: "Dashboard" },\n` +
        `    createElement("section", { className: "hero" },\n` +
        `      createElement("h1", null, "Welcome to MektA"),\n` +
        `      createElement("button", { onClick: save }, "Save Settings")\n` +
        `    )\n  );\n}</pre>`;
    }

    editor.addEventListener('input', updatePreview);
    updatePreview();
  </script>
</body>
</html>
